name: pipe
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe:
    uses: openmfp/gha/.github/workflows/pipeline-node-app.yml@b71a2deb23348f37aa0ce4b430477edce41b8a0c # main
    secrets: inherit
    with:
      node_version: '24'
      imageTagName: ghcr.io/openmfp/portal
      componentVersionKey: portal
      repoVersionUpdate: openmfp/helm-charts
