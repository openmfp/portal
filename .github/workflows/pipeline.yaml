name: pipe
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe:
    uses: openmfp/gha/.github/workflows/pipeline-node-app.yml@e3a13d61b71c77dc9412917c26bb1fa92bb86937 # main
    secrets: inherit
    with:
      node_version: '24'
      imageTagName: ghcr.io/openmfp/portal
      componentVersionKey: portal
      repoVersionUpdate: openmfp/helm-charts
